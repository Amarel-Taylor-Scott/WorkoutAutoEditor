[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidcut"
version = "0.2.0"
description = "Local Gemma-powered video editor: prompt-driven cuts via Ollama + ffmpeg"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TaylorAmarelTech" }]
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.5,<3.0",
    "requests>=2.31,<3.0",
    "rich>=13.7,<16.0",
]

[project.optional-dependencies]
ui = ["gradio>=4.36,<6.0"]
pose = ["mediapipe>=0.10.14,<0.11; python_version<'3.13'"]
all = [
    "gradio>=4.36,<6.0",
    "mediapipe>=0.10.14,<0.11; python_version<'3.13'",
]

[project.scripts]
vidcut = "vidcut.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["vidcut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
